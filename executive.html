<style>
:root {

.btn-primary:hover {

}

.btn-ghost {

.side-link {

<script>

const LS_KEY = "biz1"; // Совместимость со старой базой пользователя
const IDB_NAME = "BizPanelDB";
const IDB_STORE = "vault";
const THEME_STORAGE = "biz_exec_theme";

let periodFilter = 7; // 1 = Сегодня, 7 = 7 дней, 30 = 30 дней, 0 = Всё время

// --- CRISP SVG ICONS ---

  settings: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',

const TABS = [
  { id: "dash", short: "Сводка", title: "Сводка бизнеса", subtitle: "Главные финансовые показатели без лишних деталей", icon: SVG.dash },
  { id: "sell", short: "Продать", title: "Продать товар", subtitle: "Оформление сделки по шагам с авторасчётом прибыли", icon: SVG.sell },
  { id: "stock", short: "Склад", title: "Склад и Закупки", subtitle: "Пополнение остатков и управление ценами товаров", icon: SVG.stock },
  { id: "exp", short: "Расходы", title: "Учёт расходов", subtitle: "Аренда, транспорт, реклама и прочие затраты", icon: SVG.exp },
  { id: "settings", short: "Скидки и База", title: "Скидки и Резервная база", subtitle: "Оптовые скидки от объёма и надёжное хранение данных", icon: SVG.settings }
];

// --- DUAL STORAGE ENGINE (LocalStorage + IndexedDB) ---
function openVaultDB() {
  return new Promise((resolve) => {
    if (!window.indexedDB) return resolve(null);
    try {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) {
          db.createObjectStore(IDB_STORE);
        }
      };
      req.onsuccess = (e) => {
        idb = e.target.result;
        resolve(idb);
      };
      req.onerror = () => resolve(null);
    } catch (e) {
      resolve(null);
    }
  });
}

function getFromVault() {
  return new Promise((resolve) => {
    if (!idb) return resolve(null);
    try {
      const tx = idb.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).get(LS_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    } catch (e) {
      resolve(null);
    }
  });
}

function saveToVault(data) {
  if (!idb) return;
  try {
    const tx = idb.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(data, LS_KEY);
  } catch (e) {}
}

async function initData() {
  let local = null;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) local = JSON.parse(raw);
  } catch (e) {}

  await openVaultDB();
  const vault = await getFromVault();

  if (local && Array.isArray(local.products)) {
    DB = normalizeDB(local);
    saveToVault(DB);
  } else if (vault && Array.isArray(vault.products)) {
    DB = normalizeDB(vault);
    try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {}
    notify("Данные восстановлены из защищённого хранилища", "ok");
  } else {
    persistData(false);
  }
  updateSaveClock();
}

function normalizeDB(raw) {
  return {
    products: Array.isArray(raw.products) && raw.products.length ? raw.products : DB.products,
    sales: Array.isArray(raw.sales) ? raw.sales : [],
    buys: Array.isArray(raw.buys) ? raw.buys : [],
    exps: Array.isArray(raw.exps) ? raw.exps : [],
    tiers: Array.isArray(raw.tiers) ? raw.tiers : [[2, 5], [3, 8], [5, 10], [10, 15]],
    seq: Number(raw.seq) || 100
  };
}

function persistData(updateClock = true) {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
  } catch (e) {}
  saveToVault(DB);
  if (updateClock) updateSaveClock();
}

function updateSaveClock() {
  const now = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const sideEl = document.getElementById("sidebar-save-time");

// --- BACKUP & RESTORE ---
function exportJsonBackup() {
  try {
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `BizPanel_Backup_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    notify("Файл резервной копии (.json) сохранён на устройство", "ok");
  } catch (e) {
    notify("Не удалось создать резервную копию", "err");
  }
}

function triggerJsonImport() {
  document.getElementById("json-import-input").click();
}

function importJsonBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed && Array.isArray(parsed.products)) {
        DB = normalizeDB(parsed);
        persistData();
        renderApp();
        notify("База успешно загружена из файла!", "ok");
      } else {
        notify("Ошибка: выбран неподходящий файл", "err");
      }
    } catch (err) {
      notify("Не удалось прочитать JSON-файл", "err");
    }
    event.target.value = "";
  };
  reader.readAsText(file);
}

// --- FORMATTERS & HELPERS ---
function money(val) {
  const n = Number(val) || 0;
  return n.toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₼";
}

function signedMoney(val) {
  const n = Number(val) || 0;
  return (n > 0 ? "+" : "") + money(n);
}

function esc(str) {
  return String(str ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function findProduct(id) {
  return DB.products.find((p) => p.id == id);
}

function sumBy(list, fn) {
  return list.reduce((acc, item) => acc + (Number(fn(item)) || 0), 0);
}

function stockText(p) {
  if (!p) return "0 шт.";
  const perCan = Math.max(1, Number(p.pcs) || 1);
  const cans = Math.floor(p.stock / perCan);
  const rem = p.stock % perCan;
  return `${cans} банк. + ${rem} шт.`;
}

function calcDiscount(cansQty) {
  let best = 0;
  DB.tiers.forEach((t) => {
    if (cansQty >= t[0] && t[1] > best) best = t[1];
  });
  return best;
}

function periodStartDate() {
  if (!periodFilter) return "0000-00-00";
  const d = new Date();
  d.setDate(d.getDate() - periodFilter + 1);
  return d.toISOString().slice(0, 10);
}

// --- NOTIFICATIONS & MODALS (No alert/confirm) ---
function notify(text, type = "ok") {
  const container = document.getElementById("toasts");
  if (!container) return;
  const id = "t_" + Date.now() + Math.random().toString(36).slice(2, 6);
  const isErr = type === "err";
  const html = `
    <div id="${id}" class="pointer-events-auto flex items-center gap-3 p-3.5 rounded-2xl border shadow-2xl backdrop-blur-xl transition-all duration-300" style="background: rgba(15, 19, 29, 0.96); border-color: ${isErr ? "rgba(239, 68, 68, 0.45)" : "rgba(16, 185, 129, 0.45)"}; color: #f8fafc;">
      <div class="${isErr ? "text-red-400" : "text-emerald-400"} flex-none">${isErr ? SVG.alert : SVG.check}</div>
      <div class="text-xs sm:text-sm font-semibold leading-snug">${esc(text)}</div>
    </div>
  `;
  container.insertAdjacentHTML("beforeend", html);
  setTimeout(() => {
    const el = document.getElementById(id);
    if (el) {
      el.style.opacity = "0";
      el.style.transform = "translateY(-6px)";
      setTimeout(() => el.remove(), 250);
    }
  }, 3400);
}

function openModal(html) {
  const backdrop = document.getElementById("modal-backdrop");
  document.getElementById("modal-box").innerHTML = html;
  backdrop.classList.remove("hidden");
  backdrop.classList.add("flex");
}

function closeModal() {
  const backdrop = document.getElementById("modal-backdrop");
  backdrop.classList.add("hidden");
  backdrop.classList.remove("flex");
}

    return `

              </div>
              <div>
                <label class="block text-xs font-bold mb-1.5" style="color: var(--text-sub);">3. Дата</label>
                <input id="e-date" type="date" value="${todayISO()}" class="field-input num">

              <span class="text-sm font-extrabold num text-red-400">Всего: ${money(grandTotal)}</span>
            </div>
            ${Object.keys(totals).length ? `
              <div class="space-y-3">
                ${Object.keys(totals).sort((a, b) => totals[b] - totals[a]).map((cat) => {
                  const pct = Math.max((totals[cat] / maxCat) * 100, 4);
                  return `
                    <div>
                      <div class="flex justify-between text-xs sm:text-sm font-bold mb-1">
                        <span>${esc(cat)}</span>

            ` : `<p class="text-xs" style="color: var(--text-muted);">Расходов пока нет.</p>`}

            ${recent.length ? `

                <div>
                  <h2 class="text-base font-bold">Правила скидок от объёма</h2>
                  <p class="text-xs" style="color: var(--text-sub);">Применяются сами при продаже банок</p>
                </div>
                <button onclick="addTierRow()" class="btn-ghost !min-h-[38px] !py-1.5 !px-3 text-xs">
                  ${SVG.plus}
                  <span>Добавить</span>
                </button>
              </div>

              <div class="space-y-3">
                ${DB.tiers.map((t, i) => `
                  <div class="flex items-center gap-3 p-3 rounded-2xl border" style="background-color: var(--bg-input); border-color: var(--border-color);">
                    <div class="flex-1">
                      <label class="block text-[11px] font-semibold mb-1" style="color: var(--text-sub);">От, банок</label>
                      <input type="number" min="2" value="${t[0]}" onchange="editTier(${i}, 0, this.value)" class="field-input !min-h-[42px] num font-bold">
                    </div>
                    <div class="flex-1">
                      <label class="block text-[11px] font-semibold mb-1" style="color: var(--text-sub);">Скидка, %</label>
                      <input type="number" min="0" max="90" value="${t[1]}" onchange="editTier(${i}, 1, this.value)" class="field-input !min-h-[42px] num font-bold" style="color: var(--gold);">
                    </div>
                    <button onclick="deleteTier(${i})" class="mt-5 p-2.5 rounded-xl text-red-400 hover:bg-red-500/15 cursor-pointer" title="Удалить">
                      ${SVG.trash}
                    </button>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>

          <div class="lg:col-span-7">
            <div class="panel-card p-5 sm:p-6">
              <h2 class="text-base font-bold mb-1">Как работают скидки для «${sample ? esc(sample.name) : "товара"}»</h2>
              <p class="text-xs mb-4" style="color: var(--text-sub);">Проверка итоговой суммы и вашей прибыли при опте</p>

              ${sample ? `
                <div class="overflow-x-auto -mx-2 px-2">
                  <table class="w-full text-left border-collapse">
                    <thead>
                      <tr class="border-b text-[11px] uppercase tracking-wider" style="border-color: var(--border-color); color: var(--text-muted);">
                        <th class="py-3 px-2">Банок</th>
                        <th class="py-3 px-2">Скидка</th>
                        <th class="py-3 px-2">Итого</th>
                        <th class="py-3 px-2">За 1 б.</th>
                        <th class="py-3 px-2">Прибыль</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y text-xs sm:text-sm" style="border-color: var(--border-color);">
                      ${testQtys.map((q) => {
                        const d = calcDiscount(q);
                        const total = Math.round(sample.pw * q * (1 - d / 100) * 2) / 2;
                        const prof = total - sample.cost * q;
                        return `
                          <tr>
                            <td class="py-3 px-2 font-bold num whitespace-nowrap">${q} б.</td>
                            <td class="py-3 px-2 num font-bold whitespace-nowrap" style="color: var(--gold);">${d}%</td>
                            <td class="py-3 px-2 num font-bold whitespace-nowrap">${money(total)}</td>
                            <td class="py-3 px-2 num whitespace-nowrap">${money(total / q)}</td>
                            <td class="py-3 px-2 num font-extrabold whitespace-nowrap ${prof >= 0 ? "text-emerald-400" : "text-red-400"}">${signedMoney(prof)}</td>
                          </tr>
                        `;
                      }).join("")}
                    </tbody>
                  </table>
                </div>
              ` : `<p class="text-xs">Добавьте товар на вкладке «Склад».</p>`}
            </div>
          </div>
        </div>
      </div>
    `;
  }
};

// --- INTERACTIVE HANDLERS ---

// Sales Step 2 & 3
function chooseSaleMode(mode) {
  document.getElementById("s-mode").value = mode;
  const bCan = document.getElementById("btn-mode-can");
  const bPc = document.getElementById("btn-mode-pc");

  if (mode === "can") {
    bCan.className = "min-h-[46px] rounded-xl font-bold text-xs sm:text-sm border transition-all cursor-pointer bg-[#d4af37]/15 border-[#d4af37] text-[#d4af37]";
    bPc.className = "min-h-[46px] rounded-xl font-bold text-xs sm:text-sm border transition-all cursor-pointer";
    bPc.style.backgroundColor = "var(--bg-input)";
    bPc.style.borderColor = "var(--border-color)";
    bPc.style.color = "var(--text-sub)";
  } else {
    bPc.className = "min-h-[46px] rounded-xl font-bold text-xs sm:text-sm border transition-all cursor-pointer bg-[#d4af37]/15 border-[#d4af37] text-[#d4af37]";
    bCan.className = "min-h-[46px] rounded-xl font-bold text-xs sm:text-sm border transition-all cursor-pointer";
    bCan.style.backgroundColor = "var(--bg-input)";
    bCan.style.borderColor = "var(--border-color)";
    bCan.style.color = "var(--text-sub)";
  }
  updateSaleCalc();
}

function stepSaleQty(delta) {
  const input = document.getElementById("s-qty");
  if (!input) return;
  const next = Math.max(1, (Number(input.value) || 0) + delta);
  input.value = next;
  updateSaleCalc();
}

function updateSaleCalc() {
  const prodSel = document.getElementById("s-prod");
  if (!prodSel) return;
  const p = findProduct(prodSel.value);
  if (!p) return;

  const mode = document.getElementById("s-mode").value;
  const qty = Math.max(0, Number(document.getElementById("s-qty").value) || 0);
  const disc = mode === "can" ? calcDiscount(qty) : 0;
  const raw = mode === "can" ? p.pw * qty * (1 - disc / 100) : p.pp * qty;
  const finalPrice = Math.round(raw * 2) / 2;

  document.getElementById("s-price").value = finalPrice.toFixed(2);

  const badge = document.getElementById("s-disc-badge");
  if (disc > 0) {
    badge.textContent = `Скидка -${disc}%`;
    badge.classList.remove("hidden");
  } else {
    badge.classList.add("hidden");
  }

  updateManualProfit();
}

function updateManualProfit() {
  const prodSel = document.getElementById("s-prod");
  if (!prodSel) return;
  const p = findProduct(prodSel.value);
  if (!p) return;

  const mode = document.getElementById("s-mode").value;
  const qty = Math.max(0, Number(document.getElementById("s-qty").value) || 0);
  const price = Number(document.getElementById("s-price").value) || 0;
  const pieces = mode === "can" ? qty * p.pcs : qty;
  const cogs = (pieces * p.cost) / Math.max(1, p.pcs);
  const profit = price - cogs;

  const profEl = document.getElementById("s-live-profit");
  profEl.textContent = signedMoney(profit);
  profEl.className = `text-lg sm:text-xl font-extrabold num ${profit >= 0 ? "text-emerald-400" : "text-red-400"}`;

  const remStock = Math.max(0, p.stock - pieces);
  const remCans = Math.floor(remStock / Math.max(1, p.pcs));
  const remPcs = remStock % Math.max(1, p.pcs);
  document.getElementById("s-after-stock").textContent = pieces > p.stock ? "Не хватает на складе!" : `${remCans} банк. + ${remPcs} шт.`;
}

function confirmSale() {
  const p = findProduct(document.getElementById("s-prod").value);
  if (!p) return;
  const mode = document.getElementById("s-mode").value;
  const qty = Number(document.getElementById("s-qty").value);
  const price = Number(document.getElementById("s-price").value);
  const date = document.getElementById("s-date").value || todayISO();
  const pieces = mode === "can" ? qty * p.pcs : qty;

  if (!(qty > 0) || !(price >= 0)) {
    notify("Проверьте количество и сумму продажи", "err");
    return;
  }
  if (pieces > p.stock) {
    notify(`На складе недостаточно товара! Доступно: ${stockText(p)}`, "err");
    return;
  }

  const cogs = (pieces * p.cost) / Math.max(1, p.pcs);
  p.stock -= pieces;
  DB.sales.push({
    id: DB.seq++,
    date,
    pid: p.id,
    type: mode,
    qty,
    pieces,
    price,
    cogs
  });

  persistData();
  renderApp();
  notify(`Продажа оформлена! Прибыль: ${signedMoney(price - cogs)}`, "ok");
}

function removeSale(id) {
  const s = DB.sales.find((x) => x.id === id);
  if (!s) return;
  const p = findProduct(s.pid);
  if (p) p.stock += s.pieces;
  DB.sales = DB.sales.filter((x) => x.id !== id);
  persistData();
  renderApp();
  notify("Продажа отменена, товар возвращён на склад", "ok");
}

// Purchases (Weighted Average Cost)
function updateBuyCalc() {
  const qty = Number(document.getElementById("b-qty")?.value) || 0;
  const total = Number(document.getElementById("b-total")?.value) || 0;
  const unit = qty > 0 ? total / qty : 0;
  const el = document.getElementById("b-unit-cost");
  if (el) el.textContent = money(unit);
}

function confirmBuy() {
  const p = findProduct(document.getElementById("b-prod").value);
  if (!p) return;
  const qty = Number(document.getElementById("b-qty").value);
  const total = Number(document.getElementById("b-total").value);
  const date = document.getElementById("b-date").value || todayISO();

  if (!(qty > 0) || !(total > 0)) {
    notify("Укажите количество банок и общую сумму закупки", "err");
    return;
  }

  // Weighted average cost calculation
  const oldCans = p.stock / Math.max(1, p.pcs);
  const oldVal = oldCans * p.cost;
  const newCost = (oldVal + total) / (oldCans + qty);

  p.stock += qty * p.pcs;
  p.cost = Math.round(newCost * 100) / 100;

  DB.buys.push({
    id: DB.seq++,
    date,
    pid: p.id,
    qty,
    total
  });

  persistData();
  renderApp();
  notify(`Склад пополнен (+${qty} банк.). Новая себестоимость: ${money(p.cost)}`, "ok");
}

// Product Modal (Add & Edit)
function openProductFormModal(productId) {
  const p = productId ? findProduct(productId) : null;
  const isEdit = Boolean(p);
  const cansNow = p ? Math.floor(p.stock / Math.max(1, p.pcs)) : 0;

  openModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-extrabold">${isEdit ? "Редактировать товар" : "Добавить новый товар"}</h3>
      <button onclick="closeModal()" class="p-2 rounded-xl opacity-70 hover:opacity-100 cursor-pointer">✕</button>
    </div>
    <div class="space-y-3.5">
      <div>
        <label class="block text-xs font-bold mb-1" style="color: var(--text-sub);">Название товара</label>
        <input id="m-name" type="text" value="${isEdit ? esc(p.name) : ""}" placeholder="Например: Классика Gold" class="field-input font-bold">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold mb-1" style="color: var(--text-sub);">Закупка за банку (₼)</label>
          <input id="m-cost" type="number" step="0.1" value="${isEdit ? p.cost : "13.00"}" class="field-input num font-bold">
        </div>
        <div>
          <label class="block text-xs font-bold mb-1" style="color: var(--text-sub);">Штук в 1 банке</label>
          <input id="m-pcs" type="number" min="1" value="${isEdit ? p.pcs : "20"}" class="field-input num font-bold">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold mb-1" style="color: var(--text-sub);">Цена продажи банки (₼)</label>
          <input id="m-pw" type="number" step="0.1" value="${isEdit ? p.pw : "17.00"}" class="field-input num font-bold" style="color: var(--gold);">
        </div>
        <div>
          <label class="block text-xs font-bold mb-1" style="color: var(--text-sub);">Цена продажи 1 шт. (₼)</label>
          <input id="m-pp" type="number" step="0.1" value="${isEdit ? p.pp : "1.00"}" class="field-input num font-bold" style="color: var(--gold);">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold mb-1" style="color: var(--text-sub);">${isEdit ? "Остаток (в штуках)" : "Начальный остаток (банок)"}</label>
          <input id="m-stock" type="number" min="0" value="${isEdit ? p.stock : cansNow}" class="field-input num">
        </div>
        <div>
          <label class="block text-xs font-bold mb-1" style="color: var(--text-sub);">Мин. остаток для тревоги (шт.)</label>
          <input id="m-min" type="number" min="0" value="${isEdit ? p.min : "20"}" class="field-input num">
        </div>
      </div>
      <div class="flex justify-end gap-3 pt-3">
        <button onclick="closeModal()" class="btn-ghost">Отмена</button>
        <button onclick="saveProductFromModal(${isEdit ? p.id : "null"})" class="btn-primary px-6">
          ${isEdit ? "Сохранить изменения" : "Создать товар"}
        </button>
      </div>
    </div>
  `);
}

function saveProductFromModal(productId) {
  const name = document.getElementById("m-name").value.trim() || "Новый товар";
  const cost = Math.max(0, Number(document.getElementById("m-cost").value) || 0);
  const pcs = Math.max(1, Number(document.getElementById("m-pcs").value) || 1);
  const pw = Math.max(0, Number(document.getElementById("m-pw").value) || 0);
  const pp = Math.max(0, Number(document.getElementById("m-pp").value) || 0);
  const stockInput = Math.max(0, Number(document.getElementById("m-stock").value) || 0);
  const min = Math.max(0, Number(document.getElementById("m-min").value) || 0);

  if (productId) {
    const p = findProduct(productId);
    if (p) {
      p.name = name;
      p.cost = cost;
      p.pcs = pcs;
      p.pw = pw;
      p.pp = pp;
      p.stock = stockInput;
      p.min = min;
    }
    notify(`Товар «${name}» обновлён`, "ok");
  } else {
    DB.products.push({
      id: DB.seq++,
      name,
      cost,
      pcs,
      pw,
      pp,
      stock: stockInput * pcs,
      min
    });
    notify(`Товар «${name}» добавлен`, "ok");
  }

  persistData();
  closeModal();
  renderApp();
}

function confirmDeleteProduct(id) {
  const p = findProduct(id);
  if (!p) return;
  openModal(`
    <h3 class="text-lg font-extrabold mb-2">Удалить «${esc(p.name)}»?</h3>
    <p class="text-sm mb-5" style="color: var(--text-sub);">Товар исчезнет из каталога, но история прошлых продаж сохранится в отчётах.</p>
    <div class="flex justify-end gap-3">
      <button onclick="closeModal()" class="btn-ghost">Отмена</button>
      <button onclick="executeDeleteProduct(${id})" class="px-4 py-2.5 rounded-xl bg-red-500 text-white font-bold text-sm cursor-pointer">Удалить</button>
    </div>
  `);
}

function executeDeleteProduct(id) {
  DB.products = DB.products.filter((p) => p.id !== id);
  persistData();
  closeModal();
  renderApp();
  notify("Товар удалён из каталога", "ok");
}

// Expenses
function selectExpCategory(cat, btn) {
  document.getElementById("e-cat").value = cat;
  document.querySelectorAll(".exp-chip").forEach((el) => {
    el.className = "exp-chip py-2.5 px-2 rounded-xl text-xs font-bold border transition-all cursor-pointer";
    el.style.backgroundColor = "var(--bg-input)";
    el.style.borderColor = "var(--border-color)";
    el.style.color = "var(--text-main)";
  });
  btn.className = "exp-chip py-2.5 px-2 rounded-xl text-xs font-bold border transition-all cursor-pointer bg-[#d4af37]/15 border-[#d4af37] text-[#d4af37]";
  btn.style.backgroundColor = "";
  btn.style.borderColor = "";
  btn.style.color = "";
}

function confirmExpense() {
  const cat = document.getElementById("e-cat").value;
  const amt = Number(document.getElementById("e-amt").value);
  const date = document.getElementById("e-date").value || todayISO();
  const note = document.getElementById("e-note").value.trim();

  if (!(amt > 0)) {
    notify("Введите сумму расхода", "err");
    return;
  }

  DB.exps.push({ id: DB.seq++, date, cat, amt, note });
  persistData();
  renderApp();
  notify(`Расход ${money(amt)} записан`, "ok");
}

function removeExpense(id) {
  DB.exps = DB.exps.filter((e) => e.id !== id);
  persistData();
  renderApp();
  notify("Расход удалён", "ok");
}

// Discounts & Full Reset
function addTierRow() {
  const lastQty = DB.tiers.length ? DB.tiers[DB.tiers.length - 1][0] : 10;
  const lastPct = DB.tiers.length ? DB.tiers[DB.tiers.length - 1][1] : 15;
  DB.tiers.push([lastQty + 5, Math.min(90, lastPct + 3)]);
  persistData();
  renderApp();
}

function editTier(idx, col, val) {
  DB.tiers[idx][col] = Math.max(0, Number(val) || 0);
  persistData();
  renderApp();
}

function deleteTier(idx) {
  DB.tiers.splice(idx, 1);
  persistData();
  renderApp();
}

function confirmFullReset() {
  openModal(`
    <div class="flex items-center gap-2.5 text-red-400 mb-3">
      ${SVG.alert}
      <h3 class="text-lg font-extrabold">Очистить всю базу данных?</h3>
    </div>
    <p class="text-sm mb-5 leading-relaxed" style="color: var(--text-sub);">
      Это действие удалит все продажи, закупки, расходы и вернёт стандартный пример товара. Рекомендуем сначала скачать резервную копию (.json).
    </p>
    <div class="flex flex-wrap justify-end gap-3">
      <button onclick="closeModal()" class="btn-ghost">Отмена</button>
      <button onclick="executeFullReset()" class="px-5 py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-white font-bold text-sm cursor-pointer">Да, очистить всё</button>
    </div>
  `);
}

function executeFullReset() {
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  DB = {
    products: [{ id: 1, name: "Товар 1 (пример)", cost: 13.5, pcs: 20, pw: 17, pp: 1, stock: 200, min: 40 }],
    sales: [],
    buys: [],
    exps: [],
    tiers: [[2, 5], [3, 8], [5, 10], [10, 15]],
    seq: 2
  };
  persistData();
  closeModal();
  renderApp();
  notify("База данных очищена", "ok");
}

// --- MAIN RENDER ---
function renderApp() {
  renderNav();
  const container = document.getElementById("app-content");
  if (container && PAGES[activeTab]) {
    container.innerHTML = PAGES[activeTab]();
  }
  if (activeTab === "sell") updateSaleCalc();
  if (activeTab === "stock" && stockSubTab === "buy") updateBuyCalc();
}

window.addEventListener("DOMContentLoaded", async () => {
  initTheme();
  await initData();
  renderApp();
});
</script>
